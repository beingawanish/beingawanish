<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="debate-t debate-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="debate-t">Debate structure</title>
  <desc id="debate-d">Two peer debaters with assigned positions argue over rounds, each seeing the other&#x27;s latest argument. If all agree, the debate stops early. Otherwise a judge reads the transcript and decides with a rationale.</desc>
  <defs>
    <marker id="debate-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="270" fill="#FBF5EA"/>
  <rect x="16" y="100" width="90" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="61.0" y="131.0" text-anchor="middle" font-size="13" fill="#3B2F2A">Question</text>
  <path d="M106,116 L148,70" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <path d="M106,136 L148,182" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <rect x="150" y="40" width="150" height="60" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="225.0" y="67.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">debater A</text>
  <text x="225.0" y="83.0" text-anchor="middle" font-size="11" fill="#7A6A5E">position: for</text>
  <rect x="150" y="160" width="150" height="60" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="225.0" y="187.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">debater B</text>
  <text x="225.0" y="203.0" text-anchor="middle" font-size="11" fill="#7A6A5E">position: against</text>
  <path d="M240,100 L240,158" fill="none" stroke="#B5562E" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <path d="M210,160 L210,102" fill="none" stroke="#B5562E" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <text x="225" y="240" text-anchor="middle" font-size="10" fill="#B5562E">each sees the other&#x27;s latest argument</text>
  <rect x="330" y="96" width="130" height="64" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="395.0" y="125.0" text-anchor="middle" font-size="13" fill="#3B2F2A">transcript</text>
  <text x="395.0" y="141.0" text-anchor="middle" font-size="11" fill="#7A6A5E">rounds 1…R</text>
  <path d="M300,70 L330,110" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <path d="M300,190 L330,146" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <polygon points="500,102 526,128 500,154 474,128" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="500" y="132" text-anchor="middle" font-size="10" fill="#3B2F2A">agree?</text>
  <path d="M460,128 L474,128" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <path d="M500,102 L500,40 L610,40" fill="none" stroke="#6B7F5E" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <text x="552" y="34" text-anchor="middle" font-size="10" fill="#6B7F5E">yes → stop</text>
  <rect x="612" y="18" width="132" height="44" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="678.0" y="45.0" text-anchor="middle" font-size="12" fill="#3B2F2A">consensus</text>
  <path d="M526,128 L580,128" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#debate-ah)"/>
  <text x="552" y="120" text-anchor="middle" font-size="10" fill="#7A6A5E">no</text>
  <rect x="582" y="100" width="162" height="56" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="663.0" y="125.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">judge</text>
  <text x="663.0" y="141.0" text-anchor="middle" font-size="11" fill="#7A6A5E">decision + rationale</text>
  <rect x="582" y="180" width="162" height="46" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="663.0" y="200.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">check: order-stable?</text>
  <text x="663.0" y="216.0" text-anchor="middle" font-size="11" fill="#7A6A5E">swap order, re-judge</text>
  <path d="M663,156 L663,178" fill="none" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#debate-ah)"/>
  <text x="16" y="260" text-anchor="start" font-size="11" fill="#7A6A5E">Terracotta = model call · Sage = deterministic code · Dashed = data / failure path</text>
</svg>

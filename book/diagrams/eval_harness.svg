<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="eval_harness-t eval_harness-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="eval_harness-t">Eval harness structure</title>
  <desc id="eval_harness-d">A fixed case set runs through two versions of the system. Deterministic and model-judge scorers produce per-case scores. Reports aggregate by scorer and tag. A per-case comparison finds fixes and regressions, and a gate decides ship or block, blocking on any critical regression.</desc>
  <defs>
    <marker id="eval_harness-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="280" fill="#FBF5EA"/>
  <rect x="16" y="100" width="100" height="60" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="66.0" y="127.0" text-anchor="middle" font-size="13" fill="#3B2F2A">cases</text>
  <text x="66.0" y="143.0" text-anchor="middle" font-size="11" fill="#7A6A5E">input · tags</text>
  <path d="M116,116 L158,76" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#eval_harness-ah)"/>
  <path d="M116,144 L158,184" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#eval_harness-ah)"/>
  <rect x="160" y="50" width="120" height="52" rx="10" fill="#FFFDF8" stroke="#B5562E" stroke-width="1.5"/>
  <text x="220.0" y="81.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">system v1</text>
  <rect x="160" y="158" width="120" height="52" rx="10" fill="#FFFDF8" stroke="#B5562E" stroke-width="1.5"/>
  <text x="220.0" y="189.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">system v2</text>
  <path d="M280,76 L318,110" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#eval_harness-ah)"/>
  <path d="M280,184 L318,150" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#eval_harness-ah)"/>
  <rect x="320" y="96" width="140" height="68" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="390.0" y="127.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">scorers</text>
  <text x="390.0" y="143.0" text-anchor="middle" font-size="11" fill="#7A6A5E">exact · budget · judge</text>
  <path d="M460,130 L496,130" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#eval_harness-ah)"/>
  <rect x="498" y="96" width="110" height="68" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="553.0" y="127.0" text-anchor="middle" font-size="13" fill="#3B2F2A">reports</text>
  <text x="553.0" y="143.0" text-anchor="middle" font-size="11" fill="#7A6A5E">mean · by tag · fails</text>
  <path d="M608,130 L638,130" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#eval_harness-ah)"/>
  <polygon points="672,98 704,130 672,162 640,130" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="672" y="134" text-anchor="middle" font-size="10" fill="#3B2F2A">gate</text>
  <text x="672" y="186" text-anchor="middle" font-size="10" fill="#7A6A5E">per-case diff:</text>
  <text x="672" y="199" text-anchor="middle" font-size="10" fill="#7A6A5E">critical regression</text>
  <text x="672" y="212" text-anchor="middle" font-size="10" fill="#B5562E" font-weight="700">→ BLOCK</text>
  <text x="390" y="232" text-anchor="middle" font-size="10" fill="#7A6A5E">LLM-judge scorers use a different model from the system under test</text>
  <text x="16" y="270" text-anchor="start" font-size="11" fill="#7A6A5E">Terracotta = model call · Sage = deterministic code · Plain outline = system under test · Dashed = data</text>
</svg>

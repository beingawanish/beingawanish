<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="agentic_rag-t agentic_rag-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="agentic_rag-t">Agentic RAG structure</title>
  <desc id="agentic_rag-d">The agent decides whether retrieval is needed. If so it writes a query, retrieves, and grades the passages. Insufficient evidence leads to a reformulated query; sufficient evidence leads to an answer whose citations are checked in code. After the query budget the agent abstains.</desc>
  <defs>
    <marker id="agentic_rag-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="320" fill="#FBF5EA"/>
  <rect x="16" y="70" width="84" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="58.0" y="101.0" text-anchor="middle" font-size="13" fill="#3B2F2A">Question</text>
  <path d="M100,96 L126,96" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <polygon points="156,68 184,96 156,124 128,96" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="156" y="100" text-anchor="middle" font-size="10" fill="#3B2F2A">retrieve?</text>
  <path d="M156,68 L156,30 L296,30" fill="none" stroke="#6B7F5E" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <text x="168" y="46" text-anchor="start" font-size="10" fill="#6B7F5E">no</text>
  <rect x="298" y="12" width="150" height="36" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="373.0" y="35.0" text-anchor="middle" font-size="12" fill="#3B2F2A">direct answer</text>
  <path d="M184,96 L218,96" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <text x="200" y="88" text-anchor="middle" font-size="10" fill="#7A6A5E">yes</text>
  <rect x="220" y="70" width="112" height="52" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="276.0" y="93.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">write query</text>
  <text x="276.0" y="109.0" text-anchor="middle" font-size="11" fill="#7A6A5E">uses &#x27;missing&#x27;</text>
  <path d="M332,96 L362,96" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <rect x="364" y="70" width="104" height="52" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="416.0" y="93.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">retrieve</text>
  <text x="416.0" y="109.0" text-anchor="middle" font-size="11" fill="#7A6A5E">top-k</text>
  <path d="M468,96 L498,96" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <rect x="500" y="70" width="100" height="52" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="550.0" y="93.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">grade</text>
  <text x="550.0" y="109.0" text-anchor="middle" font-size="11" fill="#7A6A5E">relevant? enough?</text>
  <path d="M550,122 L550,170 L276,170 L276,124" fill="none" stroke="#B5562E" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <text x="415" y="164" text-anchor="middle" font-size="10" fill="#B5562E">insufficient → reformulate</text>
  <path d="M600,96 L636,96" fill="none" stroke="#6B7F5E" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <text x="618" y="88" text-anchor="middle" font-size="10" fill="#6B7F5E">enough</text>
  <rect x="638" y="70" width="106" height="52" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="691.0" y="93.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">answer</text>
  <text x="691.0" y="109.0" text-anchor="middle" font-size="11" fill="#7A6A5E">cite [ids]</text>
  <polygon points="691,148 719,176 691,204 663,176" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="691" y="180" text-anchor="middle" font-size="10" fill="#3B2F2A">cites ok?</text>
  <path d="M691,122 L691,146" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <rect x="620" y="236" width="124" height="44" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="682.0" y="263.0" text-anchor="middle" font-size="13" fill="#3B2F2A">Cited answer</text>
  <path d="M691,204 L691,234" fill="none" stroke="#6B7F5E" stroke-width="1.5" marker-end="url(#agentic_rag-ah)"/>
  <path d="M240,122 L240,234" fill="none" stroke="#B5562E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#agentic_rag-ah)"/>
  <text x="248" y="214" text-anchor="start" font-size="10" fill="#B5562E">query budget spent</text>
  <rect x="170" y="236" width="200" height="44" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="270.0" y="255.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">abstain</text>
  <text x="270.0" y="271.0" text-anchor="middle" font-size="11" fill="#7A6A5E">never guess</text>
  <text x="16" y="310" text-anchor="start" font-size="11" fill="#7A6A5E">Terracotta = model call · Sage = deterministic code · Dashed = data / failure path</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="critic_reviewer-t critic_reviewer-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="critic_reviewer-t">Critic–reviewer loop structure</title>
  <desc id="critic_reviewer-d">An author agent produces an artefact. A reviewer agent with its own tools runs tests and checks and files itemised findings with severities. The author answers each finding, fixed or won&#x27;t fix with a reason. Code tracks findings: blocking ones must be fixed; approval means none remain open.</desc>
  <defs>
    <marker id="critic_reviewer-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="280" fill="#FBF5EA"/>
  <rect x="16" y="96" width="84" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="58.0" y="127.0" text-anchor="middle" font-size="13" fill="#3B2F2A">Task</text>
  <path d="M100,122 L128,122" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#critic_reviewer-ah)"/>
  <rect x="130" y="90" width="140" height="64" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="200.0" y="119.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">author agent</text>
  <text x="200.0" y="135.0" text-anchor="middle" font-size="11" fill="#7A6A5E">writes / revises</text>
  <path d="M270,122 L318,122" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#critic_reviewer-ah)"/>
  <text x="294" y="114" text-anchor="middle" font-size="10" fill="#7A6A5E">artefact</text>
  <rect x="320" y="80" width="170" height="84" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="405.0" y="127.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600"></text>
  <text x="405" y="104" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">reviewer agent</text>
  <text x="405" y="124" text-anchor="middle" font-size="11" fill="#7A6A5E">tools: run tests, lint</text>
  <text x="405" y="140" text-anchor="middle" font-size="11" fill="#7A6A5E">never edits the code</text>
  <path d="M490,122 L536,122" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#critic_reviewer-ah)"/>
  <rect x="538" y="90" width="120" height="64" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="598.0" y="119.0" text-anchor="middle" font-size="13" fill="#3B2F2A">findings</text>
  <text x="598.0" y="135.0" text-anchor="middle" font-size="11" fill="#7A6A5E">F1 blocking · F2 nit</text>
  <path d="M598,154 L598,214 L200,214 L200,156" fill="none" stroke="#B5562E" stroke-width="1.5" marker-end="url(#critic_reviewer-ah)"/>
  <text x="400" y="208" text-anchor="middle" font-size="10" fill="#B5562E">author answers each: fixed | won&#x27;t fix + reason</text>
  <polygon points="700,94 728,122 700,150 672,122" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="700" y="126" text-anchor="middle" font-size="10" fill="#3B2F2A">blocking?</text>
  <path d="M658,122 L674,122" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#critic_reviewer-ah)"/>
  <path d="M700,96 L700,46 L560,46" fill="none" stroke="#6B7F5E" stroke-width="1.5" marker-end="url(#critic_reviewer-ah)"/>
  <text x="640" y="40" text-anchor="middle" font-size="10" fill="#6B7F5E">none: approve</text>
  <rect x="430" y="24" width="128" height="40" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="494.0" y="49.0" text-anchor="middle" font-size="12" fill="#3B2F2A">Approved</text>
  <text x="400" y="248" text-anchor="middle" font-size="10" fill="#7A6A5E">code tracks finding ids: blocking cannot be waived, nits can (with a reason)</text>
  <text x="16" y="270" text-anchor="start" font-size="11" fill="#7A6A5E">Terracotta = model call · Sage = deterministic code · Dashed = data / failure path</text>
</svg>

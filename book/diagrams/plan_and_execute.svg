<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="plan_and_execute-t plan_and_execute-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="plan_and_execute-t">Plan-and-execute structure</title>
  <desc id="plan_and_execute-d">A planner model writes an explicit multi-step plan. An executor runs steps one at a time. When a step fails, an optional local repair is tried in code, otherwise the planner re-plans the remaining steps within a re-plan budget.</desc>
  <defs>
    <marker id="plan_and_execute-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="240" fill="#FBF5EA"/>
  <rect x="16" y="46" width="80" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56.0" y="77.0" text-anchor="middle" font-size="13" fill="#3B2F2A">Goal</text>
  <path d="M96,72 L124,72" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#plan_and_execute-ah)"/>
  <rect x="126" y="40" width="128" height="64" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="190.0" y="69.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">planner</text>
  <text x="190.0" y="85.0" text-anchor="middle" font-size="11" fill="#7A6A5E">writes plan v1, v2…</text>
  <path d="M254,72 L282,72" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#plan_and_execute-ah)"/>
  <rect x="284" y="40" width="136" height="64" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="352.0" y="69.0" text-anchor="middle" font-size="13" fill="#3B2F2A">plan (JSON)</text>
  <text x="352.0" y="85.0" text-anchor="middle" font-size="11" fill="#7A6A5E">s1 → s2 → s3 → s4</text>
  <path d="M420,72 L448,72" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#plan_and_execute-ah)"/>
  <rect x="450" y="40" width="126" height="64" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="513.0" y="69.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">executor</text>
  <text x="513.0" y="85.0" text-anchor="middle" font-size="11" fill="#7A6A5E">one step at a time</text>
  <path d="M576,72 L626,72" fill="none" stroke="#6B7F5E" stroke-width="1.5" marker-end="url(#plan_and_execute-ah)"/>
  <text x="601" y="64" text-anchor="middle" font-size="10" fill="#6B7F5E">all ok</text>
  <rect x="628" y="46" width="116" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="686.0" y="77.0" text-anchor="middle" font-size="13" fill="#3B2F2A">Result</text>
  <polygon points="513,134 535,156 513,178 491,156" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="513" y="160" text-anchor="middle" font-size="10" fill="#3B2F2A">fail?</text>
  <path d="M513,104 L513,132" fill="none" stroke="#B5562E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#plan_and_execute-ah)"/>
  <rect x="572" y="136" width="150" height="40" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="647.0" y="161.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">local repair (cheap)</text>
  <path d="M535,156 L570,156" fill="none" stroke="#B5562E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#plan_and_execute-ah)"/>
  <path d="M647,136 L647,118 L560,118 L560,106" fill="none" stroke="#6B7F5E" stroke-width="1.5" marker-end="url(#plan_and_execute-ah)"/>
  <text x="610" y="112" text-anchor="middle" font-size="10" fill="#6B7F5E">retry</text>
  <path d="M491,156 L190,156 L190,106" fill="none" stroke="#B5562E" stroke-width="1.5" marker-end="url(#plan_and_execute-ah)"/>
  <text x="340" y="150" text-anchor="middle" font-size="10" fill="#B5562E">else re-plan remaining steps (≤ budget)</text>
  <text x="190" y="192" text-anchor="middle" font-size="10" fill="#7A6A5E">planner sees all results so far</text>
  <text x="16" y="230" text-anchor="start" font-size="11" fill="#7A6A5E">Terracotta = model call · Sage = deterministic code · Dashed = data / failure path</text>
</svg>

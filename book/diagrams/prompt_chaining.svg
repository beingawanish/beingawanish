<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img" aria-labelledby="pc-t pc-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="pc-t">Prompt chaining structure</title>
  <desc id="pc-d">Release notes flow through three model calls — extract, draft, compress — with code gates after extract and compress. A failing gate stops the chain early.</desc>
  <defs>
    <marker id="pc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="236" fill="#FBF5EA"/>

  <!-- input -->
  <rect x="16" y="54" width="84" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="58" y="78" text-anchor="middle" font-size="13" fill="#3B2F2A">Release</text>
  <text x="58" y="94" text-anchor="middle" font-size="13" fill="#3B2F2A">notes</text>
  <line x1="100" y1="80" x2="122" y2="80" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pc-ah)"/>

  <!-- step 1 -->
  <rect x="124" y="54" width="108" height="52" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="178" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#3B2F2A">extract</text>
  <text x="178" y="95" text-anchor="middle" font-size="11" fill="#7A6A5E">LLM call 1</text>
  <line x1="232" y1="80" x2="256" y2="80" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pc-ah)"/>

  <!-- gate 1 -->
  <polygon points="280,58 302,80 280,102 258,80" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3B2F2A">gate</text>
  <line x1="302" y1="80" x2="324" y2="80" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pc-ah)"/>
  <text x="313" y="66" text-anchor="middle" font-size="10" fill="#6B7F5E">pass</text>

  <!-- step 2 -->
  <rect x="326" y="54" width="108" height="52" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="380" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#3B2F2A">draft</text>
  <text x="380" y="95" text-anchor="middle" font-size="11" fill="#7A6A5E">LLM call 2</text>
  <line x1="434" y1="80" x2="456" y2="80" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pc-ah)"/>

  <!-- step 3 -->
  <rect x="458" y="54" width="108" height="52" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="512" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#3B2F2A">compress</text>
  <text x="512" y="95" text-anchor="middle" font-size="11" fill="#7A6A5E">LLM call 3</text>
  <line x1="566" y1="80" x2="590" y2="80" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pc-ah)"/>

  <!-- gate 2 -->
  <polygon points="614,58 636,80 614,102 592,80" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="614" y="84" text-anchor="middle" font-size="11" fill="#3B2F2A">gate</text>
  <line x1="636" y1="80" x2="658" y2="80" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pc-ah)"/>
  <text x="647" y="66" text-anchor="middle" font-size="10" fill="#6B7F5E">pass</text>

  <!-- output -->
  <rect x="660" y="54" width="84" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="702" y="78" text-anchor="middle" font-size="13" fill="#3B2F2A">Social</text>
  <text x="702" y="94" text-anchor="middle" font-size="13" fill="#3B2F2A">post</text>

  <!-- early exits -->
  <line x1="280" y1="102" x2="280" y2="146" stroke="#B5562E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pc-ah)"/>
  <text x="288" y="128" font-size="10" fill="#B5562E">fail</text>
  <rect x="206" y="148" width="148" height="40" rx="8" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#3B2F2A">stop early, log reason</text>
  <text x="280" y="181" text-anchor="middle" font-size="10" fill="#7A6A5E">later calls never run</text>

  <line x1="614" y1="102" x2="614" y2="146" stroke="#B5562E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pc-ah)"/>
  <text x="622" y="128" font-size="10" fill="#B5562E">fail</text>
  <rect x="540" y="148" width="148" height="40" rx="8" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="614" y="166" text-anchor="middle" font-size="12" fill="#3B2F2A">stop, return reason</text>
  <text x="614" y="181" text-anchor="middle" font-size="10" fill="#7A6A5E">or retry the step</text>

  <text x="16" y="222" font-size="11" fill="#7A6A5E">Terracotta = model call · Sage = deterministic code · Dashed = data</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-labelledby="pz-t pz-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="pz-t">Parallelization structure</title>
  <desc id="pz-d">A draft reply is fanned out by code to three independent model checks that run at the same time. A code fan-in step aggregates their verdicts and fails closed if any branch fails or errors.</desc>
  <defs>
    <marker id="pz-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="288" fill="#FBF5EA"/>

  <rect x="16" y="112" width="92" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="62" y="136" text-anchor="middle" font-size="13" fill="#3B2F2A">Draft</text>
  <text x="62" y="152" text-anchor="middle" font-size="13" fill="#3B2F2A">reply</text>
  <line x1="108" y1="138" x2="134" y2="138" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>

  <!-- fan-out bar -->
  <rect x="136" y="40" width="18" height="196" rx="4" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="145" y="258" text-anchor="middle" font-size="11" fill="#6B7F5E">fan-out</text>

  <!-- branches -->
  <g font-size="13" fill="#3B2F2A">
    <rect x="220" y="40" width="200" height="50" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
    <text x="320" y="62" text-anchor="middle" font-weight="600">tone check</text>
    <text x="320" y="79" text-anchor="middle" font-size="11" fill="#7A6A5E">pass · warm and professional</text>
    <rect x="220" y="113" width="200" height="50" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
    <text x="320" y="135" text-anchor="middle" font-weight="600">policy check</text>
    <text x="320" y="152" text-anchor="middle" font-size="11" fill="#B5562E">FAIL · refund over limit</text>
    <rect x="220" y="186" width="200" height="50" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
    <text x="320" y="208" text-anchor="middle" font-weight="600">facts check</text>
    <text x="320" y="225" text-anchor="middle" font-size="11" fill="#7A6A5E">pass · order matches record</text>
  </g>
  <line x1="154" y1="65" x2="216" y2="65" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>
  <line x1="154" y1="138" x2="216" y2="138" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>
  <line x1="154" y1="211" x2="216" y2="211" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>
  <text x="185" y="32" text-anchor="middle" font-size="10" fill="#7A6A5E">concurrent</text>

  <!-- fan-in -->
  <line x1="420" y1="65" x2="486" y2="65" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>
  <line x1="420" y1="138" x2="486" y2="138" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>
  <line x1="420" y1="211" x2="486" y2="211" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>
  <rect x="488" y="40" width="112" height="196" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="544" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#3B2F2A">fan-in</text>
  <text x="544" y="138" text-anchor="middle" font-size="11" fill="#3B2F2A">all pass?</text>
  <text x="544" y="155" text-anchor="middle" font-size="11" fill="#7A6A5E">errors count</text>
  <text x="544" y="169" text-anchor="middle" font-size="11" fill="#7A6A5E">as fail</text>
  <line x1="600" y1="138" x2="634" y2="138" stroke="#5A4636" stroke-width="1.5" marker-end="url(#pz-ah)"/>

  <rect x="636" y="112" width="108" height="52" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="690" y="136" text-anchor="middle" font-size="13" fill="#3B2F2A">blocked</text>
  <text x="690" y="152" text-anchor="middle" font-size="11" fill="#7A6A5E">policy failed</text>

  <text x="16" y="280" font-size="11" fill="#7A6A5E">Sectioning shown. Voting: the same prompt in every branch, and fan-in takes a majority with a quorum. · Terracotta = model · Sage = code</text>
</svg>

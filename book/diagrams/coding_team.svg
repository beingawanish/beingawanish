<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="coding_team-t coding_team-d" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif">
  <title id="coding_team-t">Coding-team capstone architecture</title>
  <desc id="coding_team-d">A tech lead supervises a dev team and a QA team. The dev team&#x27;s developer is a tool-use loop whose prompts are assembled by a context manager under a token budget. The QA team runs a critic-reviewer loop with its own tools and calls back to the developer to fix findings. Only summaries reach the tech lead.</desc>
  <defs>
    <marker id="coding_team-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A4636"/></marker>
  </defs>
  <rect width="760" height="360" fill="#FBF5EA"/>
  <text x="380" y="18" text-anchor="middle" font-size="11" fill="#6B7F5E" font-weight="700">#12 SUPERVISOR</text>
  <rect x="300" y="26" width="160" height="50" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="380.0" y="48.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">tech lead</text>
  <text x="380.0" y="64.0" text-anchor="middle" font-size="11" fill="#7A6A5E">summaries only</text>
  <text x="170" y="100" text-anchor="middle" font-size="11" fill="#6B7F5E" font-weight="700">#13 HIERARCHICAL TEAMS</text>
  <path d="M340,76 L200,116" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#coding_team-ah)"/>
  <path d="M420,76 L560,116" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#coding_team-ah)"/>
  <rect x="120" y="118" width="160" height="46" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="200.0" y="146.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">dev lead</text>
  <rect x="480" y="118" width="160" height="46" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="560.0" y="146.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">qa lead</text>
  <path d="M200,164 L200,190" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#coding_team-ah)"/>
  <path d="M560,164 L560,190" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#coding_team-ah)"/>
  <rect x="100" y="192" width="200" height="60" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="200.0" y="219.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">developer</text>
  <text x="200.0" y="235.0" text-anchor="middle" font-size="11" fill="#7A6A5E">tool-use loop (#9)</text>
  <rect x="460" y="192" width="200" height="60" rx="10" fill="#F6E3D3" stroke="#B5562E" stroke-width="1.5"/>
  <text x="560.0" y="219.0" text-anchor="middle" font-size="13" fill="#3B2F2A" font-weight="600">reviewer</text>
  <text x="560.0" y="235.0" text-anchor="middle" font-size="11" fill="#7A6A5E">critic–reviewer loop (#16)</text>
  <path d="M460,222 L302,222" fill="none" stroke="#B5562E" stroke-width="1.5" marker-end="url(#coding_team-ah)"/>
  <text x="380" y="214" text-anchor="middle" font-size="10" fill="#B5562E">findings → fix</text>
  <rect x="40" y="280" width="150" height="44" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="115.0" y="299.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">context manager</text>
  <text x="115.0" y="315.0" text-anchor="middle" font-size="11" fill="#7A6A5E">#20 · budget 300</text>
  <path d="M140,252 L115,278" fill="none" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#coding_team-ah)"/>
  <rect x="230" y="280" width="180" height="44" rx="10" fill="#FFFDF8" stroke="#8C7B70" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320.0" y="299.0" text-anchor="middle" font-size="12" fill="#3B2F2A">virtual repo</text>
  <text x="320.0" y="315.0" text-anchor="middle" font-size="11" fill="#7A6A5E">read · write · run_tests</text>
  <path d="M240,252 L290,278" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#coding_team-ah)"/>
  <rect x="470" y="280" width="190" height="44" rx="10" fill="#E7EDE1" stroke="#6B7F5E" stroke-width="1.5"/>
  <text x="565.0" y="299.0" text-anchor="middle" font-size="12" fill="#3B2F2A" font-weight="600">run tests + checks</text>
  <text x="565.0" y="315.0" text-anchor="middle" font-size="11" fill="#7A6A5E">QA&#x27;s own tools</text>
  <path d="M560,252 L560,278" fill="none" stroke="#5A4636" stroke-width="1.5" marker-end="url(#coding_team-ah)"/>
  <text x="16" y="350" text-anchor="start" font-size="11" fill="#7A6A5E">Terracotta = model call · Sage = deterministic code · Dashed = data / failure path</text>
</svg>

# Every dependency version used by the Java build, pinned in one place (implementation guide §10).
# Spring Boot's BOM manages the Spring, Kafka client, Hibernate, Flyway, Jackson, JUnit, AssertJ and
# Testcontainers versions; they are listed here only when a module needs one outside the BOM.
[versions]
java = "21"
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
avro = "1.12.1"
avro-gradle-plugin = "1.9.1"
opentelemetry-instrumentation = "2.21.0"
opentelemetry = "1.55.0"
uuid-creator = "6.1.1"
logstash-logback-encoder = "8.1"
openpdf = "2.0.5"
awssdk = "2.31.78"
archunit = "1.4.1"
jqwik = "1.9.3"
wiremock = "3.13.1"
swagger-request-validator = "2.46.1"
errorprone-core = "2.42.0"
errorprone-gradle-plugin = "4.3.0"
spotless = "7.2.1"
google-java-format = "1.28.0"
testcontainers = "1.21.4"

[libraries]
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle-plugin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
avro-gradle-plugin = { module = "com.github.davidmc24.gradle.plugin:gradle-avro-plugin", version.ref = "avro-gradle-plugin" }

spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
otel-instrumentation-bom = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom", version.ref = "opentelemetry-instrumentation" }
otel-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }

avro = { module = "org.apache.avro:avro", version.ref = "avro" }
avro-compiler = { module = "org.apache.avro:avro-compiler", version.ref = "avro" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }
otel-api = { module = "io.opentelemetry:opentelemetry-api" }
otel-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
otel-spring-boot-starter = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
swagger-request-validator-mockmvc = { module = "com.atlassian.oai:swagger-request-validator-mockmvc", version.ref = "swagger-request-validator" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }

[plugins]
avro = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "avro-gradle-plugin" }

components:
  securitySchemes:
    mtls:
      type: X509
      description: Client certificate per service; CN = service name, e.g. order-svc.
  messageTraits:
    envelopeHeaders:
      headers:
        type: object
        description: Kafka headers mirrored from the Avro envelope. Values are UTF-8 strings.
        required:
        - ce_id
        - ce_type
        - ce_source
        - ce_specversion
        - ce_time
        - correlation_id
        properties:
          ce_id:
            type: string
            description: envelope.eventId
          ce_type:
            type: string
            description: envelope.type (Avro full name)
          ce_source:
            type: string
            description: envelope.producer
          ce_specversion:
            type: string
            const: '1.0'
          ce_time:
            type: string
            format: date-time
            description: envelope.occurredAt, RFC 3339
          correlation_id:
            type: string
          causation_id:
            type: string
          traceparent:
            type: string
            description: W3C trace context
          tracestate:
            type: string
          x-retry-attempt:
            type: string
            description: Only on retry and DLQ topics (ADR-007).
          x-original-topic:
            type: string
            description: Only on retry and DLQ topics.
      correlationId:
        location: $message.header#/correlation_id
  messages:
    ProductUpserted:
      name: ProductUpserted
      title: ProductUpserted
      summary: Full snapshot of a product. Published to the compacted topic catalog.product.v1 keyed by sku, so the latest
        value per key is the current product.
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ../avro-bundled/com.edacommerce.catalog.ProductUpserted.avsc
      bindings:
        kafka:
          key:
            type: string
            description: envelope.partitionKey = sku
          schemaIdLocation: payload
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
      x-kind: event
    PriceChanged:
      name: PriceChanged
      title: PriceChanged
      summary: Current price of a SKU in a price list. Snapshot semantics on the compacted topic catalog.price.v1 keyed by
        sku.
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ../avro-bundled/com.edacommerce.catalog.PriceChanged.avsc
      bindings:
        kafka:
          key:
            type: string
            description: envelope.partitionKey = sku
          schemaIdLocation: payload
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
      x-kind: event
    StockLevelChanged:
      name: StockLevelChanged
      title: StockLevelChanged
      summary: Network-wide availability of a SKU. Snapshot semantics on the compacted topic inventory.stock-level.v1 keyed
        by sku.
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ../avro-bundled/com.edacommerce.inventory.StockLevelChanged.avsc
      bindings:
        kafka:
          key:
            type: string
            description: envelope.partitionKey = sku
          schemaIdLocation: payload
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
      x-kind: event
    CheckoutSubmitted:
      name: CheckoutSubmitted
      title: CheckoutSubmitted
      summary: A customer pressed 'Place order' and the checkout passed validation. Starts the order saga. The orderId is
        minted here so the HTTP response can return it at once.
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ../avro-bundled/com.edacommerce.checkout.CheckoutSubmitted.avsc
      bindings:
        kafka:
          key:
            type: string
            description: envelope.partitionKey = orderId
          schemaIdLocation: payload
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
      x-kind: event
    OrderPlaced:
      name: OrderPlaced
      title: OrderPlaced
      summary: The order aggregate exists and the saga has started.
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ../avro-bundled/com.edacommerce.order.OrderPlaced.avsc
      bindings:
        kafka:
          key:
            type: string
            description: envelope.partitionKey = orderId
          schemaIdLocation: payload
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
      x-kind: event
    OrderConfirmed:
      name: OrderConfirmed
      title: OrderConfirmed
      summary: Stock is committed, payment is authorised and the warehouse has been asked to fulfil.
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ../avro-bundled/com.edacommerce.order.OrderConfirmed.avsc
      bindings:
        kafka:
          key:
            type: string
            description: envelope.partitionKey = orderId
          schemaIdLocation: payload
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
      x-kind: event
    OrderCancelled:
      name: OrderCancelled
      title: OrderCancelled
      summary: The saga ended without shipping. All compensations have been issued.
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ../avro-bundled/com.edacommerce.order.OrderCancelled.avsc
      bindings:
        kafka:
          key:
            type: string
            description: envelope.partitionKey = orderId
          schemaIdLocation: payload
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
      x-kind: event
    OrderShipped:
      name: OrderShipped
      title: OrderShipped
      summary: 'The parcel left the warehouse and the payment was captured. This is the saga''s pivot: nothing before it is
        irreversible, nothing after it is compensated.'
      contentType: application/vnd.apache.avro+binary
      traits:
      - $ref: '#/components/messageTraits/envelopeHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0

[project]
name = "shipping-svc"
version = "0.1.0"
description = "eda-commerce shipping-svc (Python build)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "edacommon",
    "contracts-py",
    "fpdf2==2.9.0",
]

[project.scripts]
shipping-svc = "shipping_svc.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipping_svc"]

[tool.uv.sources]
edacommon = { workspace = true }
contracts-py = { workspace = true }

[tool.hatch.build.targets.wheel.force-include]
# Ship the Alembic scripts inside the wheel so a non-editable install (container) can migrate.
"migrations" = "shipping_svc/_migrations"

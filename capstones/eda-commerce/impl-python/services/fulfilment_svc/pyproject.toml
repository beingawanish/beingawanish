[project]
name = "fulfilment-svc"
version = "0.1.0"
description = "eda-commerce fulfilment-svc (Python build)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "edacommon",
    "contracts-py",
]

[project.scripts]
fulfilment-svc = "fulfilment_svc.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulfilment_svc"]

[tool.uv.sources]
edacommon = { workspace = true }
contracts-py = { workspace = true }

[tool.hatch.build.targets.wheel.force-include]
# Ship the Alembic scripts inside the wheel so a non-editable install (container) can migrate.
"migrations" = "fulfilment_svc/_migrations"

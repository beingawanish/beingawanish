[project]
name = "checkout-svc"
version = "0.1.0"
description = "eda-commerce checkout-svc (Python build)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "edacommon",
    "contracts-py",
]

[project.scripts]
checkout-svc = "checkout_svc.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_svc"]

[tool.uv.sources]
edacommon = { workspace = true }
contracts-py = { workspace = true }

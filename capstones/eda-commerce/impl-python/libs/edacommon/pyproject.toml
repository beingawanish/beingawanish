[project]
name = "edacommon"
version = "0.1.0"
description = "Shared runtime for every eda-commerce Python service (guide §4): envelope, serde, outbox, inbox, consumer runtime with retry/DLQ, saga kit, idempotency keys, claim check, tracing, metrics, logging, HTTP"
requires-python = ">=3.13,<3.14"
dependencies = [
    "contracts-py",
    "confluent-kafka[avro,schemaregistry]==2.16.2",
    "fastavro==1.13.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "boto3==1.44.9",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "pyjwt[crypto]==2.15.1",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edacommon"]

[tool.uv.sources]
contracts-py = { workspace = true }

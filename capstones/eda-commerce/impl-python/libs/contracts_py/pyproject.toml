[project]
name = "contracts-py"
version = "0.1.0"
description = "Generated from contracts/avro-bundled: bundled schemas as package data, typed records, topic catalogue"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling==1.33.0", "pyyaml==6.0.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts_py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# Rebuild (and so regenerate) when the contracts change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "contracts_codegen.py" },
    { file = "../../../contracts/topics.yaml" },
    { file = "../../../contracts/avro-bundled/*.avsc" },
]
